name: Live Environment Tests — Supabase + Stripe + AI

# Requires the GitHub "Production" or "Staging" environment so that secrets
# (SUPABASE_SERVICE_ROLE_KEY, STRIPE_SECRET_KEY, OPENAI_API_KEY, etc.) are
# only injected from trusted environments and never exposed to PRs from forks.
#
# Usage (manual trigger):
#   Actions → Live Environment Tests → Run workflow → choose environment

on:
  workflow_dispatch:
    inputs:
      environment:
        description: 'Deployment environment to test against'
        required: true
        default: 'Staging'
        type: choice
        options:
          - Staging
          - Production

# Minimal token permissions for all jobs.
permissions:
  contents: read

jobs:
  # ─────────────────────────────────────────────────────────────
  # 1. Supabase authenticated CRUD smoke test
  # ─────────────────────────────────────────────────────────────
  supabase-auth-crud:
    name: Supabase authenticated CRUD smoke test
    runs-on: ubuntu-latest
    environment: ${{ github.event.inputs.environment || 'Staging' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: savr-platform/web/package-lock.json

      - name: Install web dependencies
        working-directory: savr-platform/web
        run: npm ci

      - name: Run Supabase CRUD smoke tests
        working-directory: savr-platform/web
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          TEST_USER_EMAIL: ${{ secrets.TEST_USER_EMAIL }}
          TEST_USER_PASSWORD: ${{ secrets.TEST_USER_PASSWORD }}
        run: |
          if [ ! -f "$GITHUB_WORKSPACE/savr-platform/e2e-tests/supabase-crud.spec.ts" ]; then
            echo "::notice title=Skipped::supabase-crud.spec.ts is not implemented yet; skipping live Supabase CRUD gate."
            exit 0
          fi
          if [ -z "${TEST_USER_EMAIL:-}" ] || [ -z "${TEST_USER_PASSWORD:-}" ] || [ -z "${SUPABASE_SERVICE_ROLE_KEY:-}" ] || [ -z "${NEXT_PUBLIC_SUPABASE_URL:-}" ] || [ -z "${NEXT_PUBLIC_SUPABASE_ANON_KEY:-}" ]; then
            echo "::notice title=Skipped::Missing required Supabase/test-user secrets; skipping live Supabase CRUD gate."
            exit 0
          fi
          cd "$GITHUB_WORKSPACE/savr-platform/e2e-tests"
          npm ci
          npx playwright install --with-deps chromium
          npx playwright test supabase-crud.spec.ts --reporter=list

  # ─────────────────────────────────────────────────────────────
  # 2. Stripe test-mode checkout
  # ─────────────────────────────────────────────────────────────
  stripe-checkout:
    name: Stripe test-mode checkout
    runs-on: ubuntu-latest
    environment: ${{ github.event.inputs.environment || 'Staging' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: savr-platform/e2e-tests/package-lock.json

      - name: Install Playwright
        working-directory: savr-platform/e2e-tests
        run: npm ci && npx playwright install --with-deps chromium

      - name: Run Stripe checkout E2E
        working-directory: savr-platform/e2e-tests
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          STRIPE_SECRET_KEY: ${{ secrets.STRIPE_SECRET_KEY }}
          STRIPE_WEBHOOK_SECRET: ${{ secrets.STRIPE_WEBHOOK_SECRET }}
          TEST_USER_EMAIL: ${{ secrets.TEST_USER_EMAIL }}
          TEST_USER_PASSWORD: ${{ secrets.TEST_USER_PASSWORD }}
          PLAYWRIGHT_BASE_URL: ${{ vars.STAGING_URL }}
        run: |
          if [ ! -f "$GITHUB_WORKSPACE/savr-platform/e2e-tests/stripe-checkout.spec.ts" ]; then
            echo "::notice title=Skipped::stripe-checkout.spec.ts is missing; skipping Stripe checkout live gate."
            exit 0
          fi
          if [ -z "${NEXT_PUBLIC_SUPABASE_URL:-}" ] || [ -z "${NEXT_PUBLIC_SUPABASE_ANON_KEY:-}" ] || [ -z "${STRIPE_SECRET_KEY:-}" ] || [ -z "${STRIPE_WEBHOOK_SECRET:-}" ] || [ -z "${TEST_USER_EMAIL:-}" ] || [ -z "${TEST_USER_PASSWORD:-}" ] || [ -z "${PLAYWRIGHT_BASE_URL:-}" ]; then
            echo "::notice title=Skipped::Missing Stripe/Supabase/test-user secrets or base URL; skipping Stripe checkout live gate."
            exit 0
          fi
          npx playwright test stripe-checkout.spec.ts --reporter=list

  # ─────────────────────────────────────────────────────────────
  # 3. Stripe webhook delivery
  # ─────────────────────────────────────────────────────────────
  stripe-webhook:
    name: Stripe webhook delivery
    runs-on: ubuntu-latest
    environment: ${{ github.event.inputs.environment || 'Staging' }}
    needs: stripe-checkout
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Stripe CLI
        run: |
          curl -fsSL https://packages.stripe.dev/api/security/keypair/stripe-cli-gpg/public | gpg --dearmor | sudo tee /usr/share/keyrings/stripe.gpg > /dev/null
          echo "deb [signed-by=/usr/share/keyrings/stripe.gpg] https://packages.stripe.dev/stripe-cli-debian-local stable main" | sudo tee -a /etc/apt/sources.list.d/stripe.list
          sudo apt-get update -y && sudo apt-get install stripe -y

      - name: Verify webhook endpoint responds to Stripe events
        env:
          STRIPE_SECRET_KEY: ${{ secrets.STRIPE_SECRET_KEY }}
          STRIPE_WEBHOOK_SECRET: ${{ secrets.STRIPE_WEBHOOK_SECRET }}
          WEBHOOK_URL: ${{ vars.STAGING_WEBHOOK_URL }}
        run: |
          if [ -z "${STRIPE_SECRET_KEY:-}" ] || [ -z "${STRIPE_WEBHOOK_SECRET:-}" ] || [ -z "${WEBHOOK_URL:-}" ]; then
            echo "::notice title=Skipped::Missing Stripe credentials or webhook URL; skipping webhook live gate."
            exit 0
          fi
          echo "Triggering customer.subscription.created test event..."
          stripe trigger customer.subscription.created \
            --api-key "$STRIPE_SECRET_KEY" \
            --override customer:email=webhook-test@example.com \
            2>&1 || true
          echo ""
          echo "Inspect the Stripe Dashboard → Developers → Webhooks to confirm"
          echo "delivery to $WEBHOOK_URL returned HTTP 200."

  # ─────────────────────────────────────────────────────────────
  # 4. Basic monthly entitlement
  # ─────────────────────────────────────────────────────────────
  entitlement-basic-monthly:
    name: Billing entitlement — basic monthly
    runs-on: ubuntu-latest
    environment: ${{ github.event.inputs.environment || 'Staging' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: savr-platform/web/package-lock.json
      - name: Install web dependencies
        working-directory: savr-platform/web
        run: npm ci
      - name: Check basic monthly entitlement
        working-directory: savr-platform/web
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          STRIPE_SECRET_KEY: ${{ secrets.STRIPE_SECRET_KEY }}
          PRICE_ID: ${{ secrets.STRIPE_PRICE_BASIC_MONTHLY }}
        run: |
          if [ ! -f "$GITHUB_WORKSPACE/savr-platform/web/tests/billing-entitlements.test.ts" ]; then
            echo "::notice title=Skipped::billing-entitlements.test.ts is not implemented yet; skipping basic-monthly live entitlement gate."
            exit 0
          fi
          if [ -z "${PRICE_ID:-}" ] || [ -z "${STRIPE_SECRET_KEY:-}" ] || [ -z "${SUPABASE_SERVICE_ROLE_KEY:-}" ] || [ -z "${NEXT_PUBLIC_SUPABASE_URL:-}" ]; then
            echo "::notice title=Skipped::Missing Stripe/Supabase secrets; skipping basic-monthly live entitlement gate."
            exit 0
          fi
          node --import tsx --test tests/billing-entitlements.test.ts

  # ─────────────────────────────────────────────────────────────
  # 5. Basic yearly entitlement
  # ─────────────────────────────────────────────────────────────
  entitlement-basic-yearly:
    name: Billing entitlement — basic yearly
    runs-on: ubuntu-latest
    environment: ${{ github.event.inputs.environment || 'Staging' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: savr-platform/web/package-lock.json
      - name: Install web dependencies
        working-directory: savr-platform/web
        run: npm ci
      - name: Check basic yearly entitlement
        working-directory: savr-platform/web
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          STRIPE_SECRET_KEY: ${{ secrets.STRIPE_SECRET_KEY }}
          PRICE_ID: ${{ secrets.STRIPE_PRICE_BASIC_YEARLY }}
        run: |
          if [ ! -f "$GITHUB_WORKSPACE/savr-platform/web/tests/billing-entitlements.test.ts" ]; then
            echo "::notice title=Skipped::billing-entitlements.test.ts is not implemented yet; skipping basic-yearly live entitlement gate."
            exit 0
          fi
          if [ -z "${PRICE_ID:-}" ] || [ -z "${STRIPE_SECRET_KEY:-}" ] || [ -z "${SUPABASE_SERVICE_ROLE_KEY:-}" ] || [ -z "${NEXT_PUBLIC_SUPABASE_URL:-}" ]; then
            echo "::notice title=Skipped::Missing Stripe/Supabase secrets; skipping basic-yearly live entitlement gate."
            exit 0
          fi
          node --import tsx --test tests/billing-entitlements.test.ts

  # ─────────────────────────────────────────────────────────────
  # 6. Pro monthly entitlement
  # ─────────────────────────────────────────────────────────────
  entitlement-pro-monthly:
    name: Billing entitlement — pro monthly
    runs-on: ubuntu-latest
    environment: ${{ github.event.inputs.environment || 'Staging' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: savr-platform/web/package-lock.json
      - name: Install web dependencies
        working-directory: savr-platform/web
        run: npm ci
      - name: Check pro monthly entitlement
        working-directory: savr-platform/web
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          STRIPE_SECRET_KEY: ${{ secrets.STRIPE_SECRET_KEY }}
          PRICE_ID: ${{ secrets.STRIPE_PRICE_PRO_MONTHLY }}
        run: |
          if [ ! -f "$GITHUB_WORKSPACE/savr-platform/web/tests/billing-entitlements.test.ts" ]; then
            echo "::notice title=Skipped::billing-entitlements.test.ts is not implemented yet; skipping pro-monthly live entitlement gate."
            exit 0
          fi
          if [ -z "${PRICE_ID:-}" ] || [ -z "${STRIPE_SECRET_KEY:-}" ] || [ -z "${SUPABASE_SERVICE_ROLE_KEY:-}" ] || [ -z "${NEXT_PUBLIC_SUPABASE_URL:-}" ]; then
            echo "::notice title=Skipped::Missing Stripe/Supabase secrets; skipping pro-monthly live entitlement gate."
            exit 0
          fi
          node --import tsx --test tests/billing-entitlements.test.ts

  # ─────────────────────────────────────────────────────────────
  # 7. Pro yearly entitlement
  # ─────────────────────────────────────────────────────────────
  entitlement-pro-yearly:
    name: Billing entitlement — pro yearly
    runs-on: ubuntu-latest
    environment: ${{ github.event.inputs.environment || 'Staging' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: savr-platform/web/package-lock.json
      - name: Install web dependencies
        working-directory: savr-platform/web
        run: npm ci
      - name: Check pro yearly entitlement
        working-directory: savr-platform/web
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          STRIPE_SECRET_KEY: ${{ secrets.STRIPE_SECRET_KEY }}
          PRICE_ID: ${{ secrets.STRIPE_PRICE_PRO_YEARLY }}
        run: |
          if [ ! -f "$GITHUB_WORKSPACE/savr-platform/web/tests/billing-entitlements.test.ts" ]; then
            echo "::notice title=Skipped::billing-entitlements.test.ts is not implemented yet; skipping pro-yearly live entitlement gate."
            exit 0
          fi
          if [ -z "${PRICE_ID:-}" ] || [ -z "${STRIPE_SECRET_KEY:-}" ] || [ -z "${SUPABASE_SERVICE_ROLE_KEY:-}" ] || [ -z "${NEXT_PUBLIC_SUPABASE_URL:-}" ]; then
            echo "::notice title=Skipped::Missing Stripe/Supabase secrets; skipping pro-yearly live entitlement gate."
            exit 0
          fi
          node --import tsx --test tests/billing-entitlements.test.ts

  # ─────────────────────────────────────────────────────────────
  # 8. Customer portal
  # ─────────────────────────────────────────────────────────────
  stripe-customer-portal:
    name: Stripe customer portal
    runs-on: ubuntu-latest
    environment: ${{ github.event.inputs.environment || 'Staging' }}
    needs: stripe-checkout
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: savr-platform/e2e-tests/package-lock.json

      - name: Install Playwright
        working-directory: savr-platform/e2e-tests
        run: npm ci && npx playwright install --with-deps chromium

      - name: Test customer portal redirect
        working-directory: savr-platform/e2e-tests
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          STRIPE_SECRET_KEY: ${{ secrets.STRIPE_SECRET_KEY }}
          TEST_USER_EMAIL: ${{ secrets.TEST_USER_EMAIL }}
          TEST_USER_PASSWORD: ${{ secrets.TEST_USER_PASSWORD }}
          PLAYWRIGHT_BASE_URL: ${{ vars.STAGING_URL }}
        run: |
          if [ ! -f "$GITHUB_WORKSPACE/savr-platform/e2e-tests/customer-portal.spec.ts" ]; then
            echo "::notice title=Skipped::customer-portal.spec.ts is not implemented yet; skipping Stripe portal live gate."
            exit 0
          fi
          if [ -z "${TEST_USER_EMAIL:-}" ] || [ -z "${TEST_USER_PASSWORD:-}" ] || [ -z "${PLAYWRIGHT_BASE_URL:-}" ] || [ -z "${STRIPE_SECRET_KEY:-}" ] || [ -z "${NEXT_PUBLIC_SUPABASE_URL:-}" ] || [ -z "${NEXT_PUBLIC_SUPABASE_ANON_KEY:-}" ]; then
            echo "::notice title=Skipped::Missing Stripe/Supabase/test-user secrets; skipping Stripe portal live gate."
            exit 0
          fi
          npx playwright test customer-portal.spec.ts --reporter=list

  # ─────────────────────────────────────────────────────────────
  # 9. Subscription cancellation
  # ─────────────────────────────────────────────────────────────
  stripe-cancellation:
    name: Subscription cancellation
    runs-on: ubuntu-latest
    environment: ${{ github.event.inputs.environment || 'Staging' }}
    needs: entitlement-basic-monthly
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Test cancellation flow
        env:
          STRIPE_SECRET_KEY: ${{ secrets.STRIPE_SECRET_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
        run: |
          if [ ! -f "$GITHUB_WORKSPACE/savr-platform/web/tests/subscription-cancellation.live.test.ts" ]; then
            echo "::notice title=Skipped::subscription-cancellation live test is not implemented yet; skipping cancellation gate."
            exit 0
          fi
          if [ -z "${STRIPE_SECRET_KEY:-}" ] || [ -z "${SUPABASE_SERVICE_ROLE_KEY:-}" ] || [ -z "${NEXT_PUBLIC_SUPABASE_URL:-}" ]; then
            echo "::notice title=Skipped::Missing Stripe/Supabase secrets; skipping cancellation gate."
            exit 0
          fi
          cd "$GITHUB_WORKSPACE/savr-platform/web"
          node --import tsx --test tests/subscription-cancellation.live.test.ts

  # ─────────────────────────────────────────────────────────────
  # 10. Subscription upgrade/downgrade
  # ─────────────────────────────────────────────────────────────
  stripe-upgrade-downgrade:
    name: Subscription upgrade/downgrade
    runs-on: ubuntu-latest
    environment: ${{ github.event.inputs.environment || 'Staging' }}
    needs: entitlement-basic-monthly
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Test upgrade/downgrade flow
        env:
          STRIPE_SECRET_KEY: ${{ secrets.STRIPE_SECRET_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          STRIPE_PRICE_BASIC_MONTHLY: ${{ secrets.STRIPE_PRICE_BASIC_MONTHLY }}
          STRIPE_PRICE_PRO_MONTHLY: ${{ secrets.STRIPE_PRICE_PRO_MONTHLY }}
        run: |
          if [ ! -f "$GITHUB_WORKSPACE/savr-platform/web/tests/subscription-upgrade-downgrade.live.test.ts" ]; then
            echo "::notice title=Skipped::subscription-upgrade-downgrade live test is not implemented yet; skipping upgrade/downgrade gate."
            exit 0
          fi
          if [ -z "${STRIPE_SECRET_KEY:-}" ] || [ -z "${SUPABASE_SERVICE_ROLE_KEY:-}" ] || [ -z "${NEXT_PUBLIC_SUPABASE_URL:-}" ] || [ -z "${STRIPE_PRICE_BASIC_MONTHLY:-}" ] || [ -z "${STRIPE_PRICE_PRO_MONTHLY:-}" ]; then
            echo "::notice title=Skipped::Missing Stripe/Supabase secrets; skipping upgrade/downgrade gate."
            exit 0
          fi
          cd "$GITHUB_WORKSPACE/savr-platform/web"
          node --import tsx --test tests/subscription-upgrade-downgrade.live.test.ts

  # ─────────────────────────────────────────────────────────────
  # 11. AI request and durable rate-limit behavior
  # ─────────────────────────────────────────────────────────────
  ai-rate-limit:
    name: AI request and durable rate-limit behavior
    runs-on: ubuntu-latest
    environment: ${{ github.event.inputs.environment || 'Staging' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: savr-platform/web/package-lock.json

      - name: Install web dependencies
        working-directory: savr-platform/web
        run: npm ci

      - name: Test AI rate limiting
        working-directory: savr-platform/web
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          TEST_USER_EMAIL: ${{ secrets.TEST_USER_EMAIL }}
          TEST_USER_PASSWORD: ${{ secrets.TEST_USER_PASSWORD }}
          PLAYWRIGHT_BASE_URL: ${{ vars.STAGING_URL }}
        run: |
          if [ ! -f "$GITHUB_WORKSPACE/savr-platform/web/tests/ai-rate-limit.live.test.ts" ]; then
            echo "::notice title=Skipped::ai-rate-limit live test is not implemented yet; skipping AI live gate."
            exit 0
          fi
          if [ -z "${NEXT_PUBLIC_SUPABASE_URL:-}" ] || [ -z "${SUPABASE_SERVICE_ROLE_KEY:-}" ] || [ -z "${OPENAI_API_KEY:-}" ] || [ -z "${TEST_USER_EMAIL:-}" ] || [ -z "${TEST_USER_PASSWORD:-}" ] || [ -z "${PLAYWRIGHT_BASE_URL:-}" ]; then
            echo "::notice title=Skipped::Missing AI/Supabase/test-user secrets; skipping AI live gate."
            exit 0
          fi
          node --import tsx --test tests/ai-rate-limit.live.test.ts
