# Google Cloud Build configuration for SAVR Android Mobile App
# This builds an Android App Bundle (.aab) for Google Play Store distribution
# 
# Required Google Cloud Secret Manager secrets:
#   - KEYSTORE_NAME: Name of the keystore file
#   - KEYSTORE_PASSWORD: Password for the keystore
#   - KEY_ALIAS: Alias of the signing key
#   - KEY_PASSWORD: Password for the signing key
#   - FIREBASE_API_KEY: Firebase API key
#   - FIREBASE_AUTH_DOMAIN: Firebase auth domain
#   - FIREBASE_PROJECT_ID: Firebase project ID
#   - FIREBASE_STORAGE_BUCKET: Firebase storage bucket
#   - FIREBASE_MESSAGING_SENDER_ID: Firebase messaging sender ID
#   - FIREBASE_APP_ID: Firebase app ID
#
# Substitution variables:
#   - _KEYSTORE_NAME: Name of the keystore file (default: 'savr-release.keystore')
#   - _TRACK: Google Play track (default: 'internal', options: internal|alpha|beta|production)

steps:
  # Step 1: Install Node.js dependencies
  - name: 'gcr.io/cloud-builders/npm'
    args: ['ci']
    dir: 'mobile'
    id: 'install-dependencies'

  # Step 2: Run TypeScript type checking
  - name: 'gcr.io/cloud-builders/npm'
    args: ['run', 'tsc', '--', '--noEmit']
    dir: 'mobile'
    id: 'type-check'
    waitFor: ['install-dependencies']

  # Step 3: Retrieve keystore from Secret Manager
  - name: 'gcr.io/cloud-builders/gcloud'
    args:
      - 'secrets'
      - 'versions'
      - 'access'
      - 'latest'
      - '--secret=${_KEYSTORE_NAME}'
      - '--format=get(payload.data)'
    dir: 'mobile'
    id: 'get-keystore'
    secretEnv: ['KEYSTORE_PASSWORD', 'KEY_ALIAS', 'KEY_PASSWORD']

  # Step 4: Setup EAS CLI and authenticate
  - name: 'gcr.io/cloud-builders/npm'
    args: ['install', '-g', 'eas-cli']
    id: 'install-eas'
    waitFor: ['install-dependencies']

  # Step 5: Configure app.json with Firebase credentials from Secret Manager
  - name: 'gcr.io/cloud-builders/npm'
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        cat > /workspace/mobile/app.config.js <<EOF
        module.exports = {
          ...require('./app.json').expo,
          extra: {
            ...require('./app.json').expo.extra,
            firebaseApiKey: process.env.FIREBASE_API_KEY,
            firebaseAuthDomain: process.env.FIREBASE_AUTH_DOMAIN,
            firebaseProjectId: process.env.FIREBASE_PROJECT_ID,
            firebaseStorageBucket: process.env.FIREBASE_STORAGE_BUCKET,
            firebaseMessagingSenderId: process.env.FIREBASE_MESSAGING_SENDER_ID,
            firebaseAppId: process.env.FIREBASE_APP_ID,
          }
        };
        EOF
    dir: 'mobile'
    id: 'configure-app'
    waitFor: ['type-check']
    secretEnv: ['FIREBASE_API_KEY', 'FIREBASE_AUTH_DOMAIN', 'FIREBASE_PROJECT_ID', 
                'FIREBASE_STORAGE_BUCKET', 'FIREBASE_MESSAGING_SENDER_ID', 'FIREBASE_APP_ID']

  # Step 6: Build Android App Bundle (.aab) using EAS Build
  - name: 'gcr.io/cloud-builders/npm'
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        npx eas-cli build --platform android --profile production --non-interactive --no-wait
    dir: 'mobile'
    id: 'build-aab'
    waitFor: ['install-eas', 'configure-app', 'get-keystore']
    secretEnv: ['KEYSTORE_PASSWORD', 'KEY_ALIAS', 'KEY_PASSWORD']
    env:
      - 'EXPO_NO_TELEMETRY=1'

  # Step 7: Submit to Google Play Store (optional, controlled by _TRACK)
  - name: 'gcr.io/cloud-builders/npm'
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        if [ "${_TRACK}" != "none" ]; then
          npx eas-cli submit --platform android --latest --track ${_TRACK} --non-interactive
        else
          echo "Skipping submission (_TRACK=none)"
        fi
    dir: 'mobile'
    id: 'submit-to-play-store'
    waitFor: ['build-aab']

# Configure build timeout (default is 10 minutes, Android builds can take longer)
timeout: '3600s'

# Substitution variables with defaults
substitutions:
  _KEYSTORE_NAME: 'savr-release-keystore'
  _TRACK: 'internal'

# Access secrets from Google Cloud Secret Manager
availableSecrets:
  secretManager:
    - versionName: projects/${PROJECT_ID}/secrets/KEYSTORE_PASSWORD/versions/latest
      env: 'KEYSTORE_PASSWORD'
    - versionName: projects/${PROJECT_ID}/secrets/KEY_ALIAS/versions/latest
      env: 'KEY_ALIAS'
    - versionName: projects/${PROJECT_ID}/secrets/KEY_PASSWORD/versions/latest
      env: 'KEY_PASSWORD'
    - versionName: projects/${PROJECT_ID}/secrets/FIREBASE_API_KEY/versions/latest
      env: 'FIREBASE_API_KEY'
    - versionName: projects/${PROJECT_ID}/secrets/FIREBASE_AUTH_DOMAIN/versions/latest
      env: 'FIREBASE_AUTH_DOMAIN'
    - versionName: projects/${PROJECT_ID}/secrets/FIREBASE_PROJECT_ID/versions/latest
      env: 'FIREBASE_PROJECT_ID'
    - versionName: projects/${PROJECT_ID}/secrets/FIREBASE_STORAGE_BUCKET/versions/latest
      env: 'FIREBASE_STORAGE_BUCKET'
    - versionName: projects/${PROJECT_ID}/secrets/FIREBASE_MESSAGING_SENDER_ID/versions/latest
      env: 'FIREBASE_MESSAGING_SENDER_ID'
    - versionName: projects/${PROJECT_ID}/secrets/FIREBASE_APP_ID/versions/latest
      env: 'FIREBASE_APP_ID'

# Build artifacts to save
artifacts:
  objects:
    location: 'gs://${PROJECT_ID}_cloudbuild/android-builds/${BUILD_ID}'
    paths: ['mobile/*.aab', 'mobile/*.apk']

# Build options
options:
  machineType: 'E2_HIGHCPU_8'
  logging: CLOUD_LOGGING_ONLY
  substitutionOption: 'ALLOW_LOOSE'
