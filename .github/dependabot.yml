version: 2
updates:
  - package-ecosystem: npm
    directory: /savr-platform/web
    schedule:
      interval: weekly
    ignore:
      - dependency-name: next
        update-types: [version-update:semver-major]
      - dependency-name: react
        update-types: [version-update:semver-major]
      - dependency-name: react-dom
        update-types: [version-update:semver-major]
      # eslint-config-next does not load under ESLint 10 yet.
      - dependency-name: eslint
        update-types: [version-update:semver-major]
      # typescript-eslint (via eslint-config-next) refuses to load under
      # TypeScript 7, so a TS major breaks `npm run lint`.
      - dependency-name: typescript
        update-types: [version-update:semver-major]
      # Stripe SDK majors change the pinned API version and response types
      # used by server-side billing; they need a deliberate billing migration.
      - dependency-name: stripe
        update-types: [version-update:semver-major]
      - dependency-name: "@stripe/stripe-js"
        update-types: [version-update:semver-major]
      # ADR-005 excepts braces only on the exact path through
      # eslint-config-next@16.3.8. Any eslint-config-next version changes that
      # path and fails the audit gate by design, so it moves only together
      # with a re-approved exception record (or once braces is fixed upstream).
      - dependency-name: eslint-config-next
    # Batch compatible minor/patch bumps for this workspace into one PR.
    # Majors and the SDK-pinned packages above stay excluded by `ignore`.
    groups:
      web-minor-and-patch:
        update-types: [minor, patch]

  - package-ecosystem: npm
    directory: /savr-platform/mobile
    schedule:
      interval: weekly
    ignore:
      - dependency-name: expo
        update-types: [version-update:semver-major]
      # react-native is pinned to an exact version by the Expo SDK
      # (bundledNativeModules); even a semver-minor bump fails Expo Doctor.
      # It moves only with `npx expo install --fix`.
      - dependency-name: react-native
      # React and its types are pinned by the Expo SDK as well; they move
      # with `npx expo install --fix`, not independently.
      - dependency-name: react
      - dependency-name: "@types/react"
        update-types: [version-update:semver-major, version-update:semver-minor]
      # Native modules are pinned by the Expo SDK. Versions outside the SDK's
      # expected range build fine but can crash the app on launch, so these
      # move only through `npx expo install --fix` when the SDK is upgraded.
      - dependency-name: "expo-*"
      - dependency-name: "react-native-*"
      - dependency-name: "@react-native-async-storage/*"
      - dependency-name: typescript
        update-types: [version-update:semver-major]
      # eslint-config-expo does not load under ESLint 10 yet.
      - dependency-name: eslint
        update-types: [version-update:semver-major]
    # Batch compatible minor/patch bumps for this workspace into one PR.
    # Majors and the SDK-pinned packages above stay excluded by `ignore`.
    groups:
      mobile-minor-and-patch:
        update-types: [minor, patch]

  - package-ecosystem: npm
    directory: /savr-platform/e2e-tests
    schedule:
      interval: weekly
    # Batch compatible minor/patch bumps for this workspace into one PR.
    groups:
      e2e-minor-and-patch:
        update-types: [minor, patch]

  # Protected reference folders (AGENTS.md): read-only after import and
  # checked by Reference Integrity. Ignoring every dependency here also stops
  # Dependabot security-update PRs, which honour ignore conditions; such PRs
  # are what modified these manifests on main before.
  - package-ecosystem: npm
    directory: /SAVR-old/web
    schedule:
      interval: weekly
    open-pull-requests-limit: 0
    ignore:
      - dependency-name: "*"

  - package-ecosystem: npm
    directory: /SAVR-old/mobile
    schedule:
      interval: weekly
    open-pull-requests-limit: 0
    ignore:
      - dependency-name: "*"

  - package-ecosystem: npm
    directory: /savr-premium-mobile-app
    schedule:
      interval: weekly
    open-pull-requests-limit: 0
    ignore:
      - dependency-name: "*"
